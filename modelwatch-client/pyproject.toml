[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelwatch-client"
version = "0.1.0"
description = "Thin client for reporting model checks and RAG traces to a ModelWatch server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
dev = ["pytest>=8.0", "pytest-httpserver>=1.0", "langchain-core>=0.3"]

[tool.setuptools.packages.find]
include = ["modelwatch_client*"]
