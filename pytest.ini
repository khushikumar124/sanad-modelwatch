[pytest]
# Collection order matters here, not just which tests run: sanad's test
# isolation (sanad/tests/test_api.py, test_auth.py, test_comments.py,
# test_migrate_documents.py, test_authorization.py,
# sanad/tests/frontend/conftest.py) works by setting SANAD_CHROMA_DB_PATH /
# SANAD_UPLOAD_DIR / SANAD_DATABASE_URL env vars *before* importing
# sanad.api.app for the first time -- sanad/config.py's Config dataclass
# reads those env vars into frozen fields at class-definition time (import
# time), once per process. Whichever test file's conftest imports
# sanad.config first "wins" those isolated paths for the whole test run;
# every later import just reuses the cached module.
#
# ml/'s tests import sanad.ingestion/sanad.features (via ml.build_dataset)
# without ever setting those env vars first, because ml/ has no reason to
# care about Sanad's live app storage. If pytest's default alphabetical
# discovery lets ml/ get collected before sanad/ (it does: 'ml' < 'sanad'),
# sanad.config bakes in its *production* defaults (sanad_chroma_db,
# sanad_documents.db, sanad_uploads) instead of a test's throwaway temp
# paths -- silently pointing every "isolated" test's uploads at the same
# database `./run.sh` uses for real. Listing sanad/ and modelwatch/ first
# guarantees they're collected (and sanad.config imported, with test env
# vars already set) before ml/ or modelwatch-client/ get anywhere near it.
testpaths =
    sanad
    modelwatch
    shared
    ml
    modelwatch-client
    examples
