<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sanad</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --border: #e7e0d4;
    --text: #2b2620;
    --text-dim: #7a7264;
    --accent: #b5651d;
    --accent-soft: #f3e3d3;
    --ok: #2f7d5f;
    --ok-soft: #e3f1ea;
    --warn: #a34a3a;
    --warn-soft: #f6e4e0;
    --radius: 10px;
    --font: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-family: var(--font);
    font-size: 26px;
    margin: 0 0 2px 0;
    color: var(--accent);
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .card h2 {
    font-family: var(--font);
    font-size: 18px;
    margin: 0 0 12px 0;
  }
  .upload-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="file"] {
    flex: 1;
    min-width: 200px;
    font-size: 13px;
  }
  select, button, input[type="text"] {
    font-family: var(--font-ui);
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid var(--border);
    padding: 8px 12px;
    background: white;
    color: var(--text);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { opacity: 0.92; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .status {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .status.error { color: var(--warn); }
  .doc-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.neutral { background: var(--accent-soft); color: var(--accent); }

  #hiddenUntilUpload, #hiddenUntilSummary { display: none; }

  .summary-section { margin-bottom: 16px; }
  .summary-section:last-child { margin-bottom: 0; }
  .summary-section h3 {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0 0 6px 0;
  }
  .summary-section ul { margin: 0; padding-left: 20px; }
  .summary-section .empty { color: var(--text-dim); font-style: italic; }

  #chatLog {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 420px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .msg { max-width: 90%; }
  .msg.user { align-self: flex-end; text-align: right; }
  .msg .bubble {
    display: inline-block;
    padding: 9px 13px;
    border-radius: 10px;
    text-align: left;
  }
  .msg.user .bubble { background: var(--accent-soft); color: var(--text); }
  .msg.assistant .bubble { background: #f4f1ea; }
  .msg.assistant .bubble.refused { background: var(--warn-soft); }
  .sources {
    margin-top: 6px;
    font-size: 12px;
  }
  .sources summary { cursor: pointer; color: var(--accent); }
  .source-item {
    border-left: 2px solid var(--accent-soft);
    padding: 4px 10px;
    margin-top: 6px;
    color: var(--text-dim);
  }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input[type="text"] { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>Sanad</h1>
  <p>Upload a rental, employment, or freelance agreement to get a plain-language summary and ask it questions.</p>
</header>

<main>
  <div class="card" id="uploadCard">
    <h2>1. Upload a contract</h2>
    <div class="upload-row">
      <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tiff,.tif,.bmp" />
      <select id="contractType">
        <option value="">Type (optional)</option>
        <option value="rental">Rental</option>
        <option value="employment">Employment</option>
        <option value="freelance">Freelance / Service</option>
      </select>
      <button id="uploadBtn">Upload &amp; Process</button>
    </div>
    <div class="status" id="uploadStatus"></div>
  </div>

  <div class="card" id="hiddenUntilUpload">
    <h2>Document</h2>
    <div class="doc-meta">
      <span id="docFilename"></span>
      <span id="docChunks"></span>
      <span id="docOcr" class="badge"></span>
      <span id="docType" class="badge neutral"></span>
    </div>
  </div>

  <div class="card" id="summaryCard" style="display:none;">
    <h2>2. Summary</h2>
    <button id="summarizeBtn" class="secondary">Generate Summary</button>
    <div class="status" id="summaryStatus"></div>
    <div id="summaryOutput" style="margin-top:14px;"></div>
  </div>

  <div class="card" id="chatCard" style="display:none;">
    <h2>3. Ask a question</h2>
    <div id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="e.g. What is my notice period?" />
      <button id="chatSendBtn">Ask</button>
    </div>
    <div class="status" id="chatStatus"></div>
  </div>
</main>

<script>
const API_BASE = "/api";
let currentDocId = null;

async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, options);
  if (!res.ok) {
    let detail;
    try { detail = (await res.json()).detail; } catch { detail = res.statusText; }
    const err = new Error(detail || `${path} -> ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

document.getElementById("uploadBtn").addEventListener("click", async () => {
  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("uploadStatus");
  if (!fileInput.files.length) {
    statusEl.textContent = "Choose a file first.";
    statusEl.className = "status error";
    return;
  }
  const form = new FormData();
  form.append("file", fileInput.files[0]);
  const contractType = document.getElementById("contractType").value;
  if (contractType) form.append("contract_type", contractType);

  statusEl.textContent = "Uploading and processing (extraction, chunking, embedding)...";
  statusEl.className = "status";

  try {
    const doc = await api("/documents", { method: "POST", body: form });
    currentDocId = doc.doc_id;
    statusEl.textContent = "Done.";
    document.getElementById("hiddenUntilUpload").style.display = "block";
    document.getElementById("summaryCard").style.display = "block";
    document.getElementById("chatCard").style.display = "block";
    document.getElementById("docFilename").textContent = doc.filename;
    document.getElementById("docChunks").textContent = `${doc.chunk_count} chunks indexed`;
    const ocrBadge = document.getElementById("docOcr");
    ocrBadge.textContent = doc.used_ocr ? "OCR used" : "native text";
    ocrBadge.className = "badge " + (doc.used_ocr ? "warn" : "ok");
    const typeBadge = document.getElementById("docType");
    typeBadge.textContent = doc.contract_type || "uncategorized";
    document.getElementById("chatLog").innerHTML = "";
    document.getElementById("summaryOutput").innerHTML = "";
  } catch (err) {
    statusEl.textContent = "Upload failed: " + err.message;
    statusEl.className = "status error";
  }
});

function renderSummarySection(title, items) {
  const list = (items && items.length)
    ? `<ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>`
    : `<div class="empty">Not found in the document.</div>`;
  return `<div class="summary-section"><h3>${title}</h3>${list}</div>`;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

document.getElementById("summarizeBtn").addEventListener("click", async () => {
  const statusEl = document.getElementById("summaryStatus");
  const output = document.getElementById("summaryOutput");
  statusEl.textContent = "Generating summary (this can take a while on a local model)...";
  statusEl.className = "status";
  output.innerHTML = "";
  try {
    const summary = await api(`/documents/${currentDocId}/summarize`, { method: "POST" });
    statusEl.textContent = summary.parse_error
      ? "The model's response could not be fully parsed; showing what was recovered."
      : "";
    statusEl.className = summary.parse_error ? "status error" : "status";
    output.innerHTML =
      renderSummarySection("Parties", summary.parties) +
      renderSummarySection("Key Obligations", summary.key_obligations) +
      renderSummarySection("Important Dates", summary.important_dates) +
      `<div class="summary-section"><h3>Notice Period</h3><div>${summary.notice_period ? escapeHtml(summary.notice_period) : '<span class="empty">Not found in the document.</span>'}</div></div>` +
      renderSummarySection("Penalty Clauses", summary.penalty_clauses) +
      renderSummarySection("Termination Conditions", summary.termination_conditions);
  } catch (err) {
    // The API's 503 detail already names the specific problem (server down
    // vs. model not pulled) and the command to fix it, so show it verbatim
    // rather than a generic guess.
    statusEl.textContent = err.status === 503 ? err.message : "Summarization failed: " + err.message;
    statusEl.className = "status error";
  }
});

function appendChatMessage(role, html) {
  const log = document.getElementById("chatLog");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById("chatInput");
  const statusEl = document.getElementById("chatStatus");
  const question = input.value.trim();
  if (!question) return;
  appendChatMessage("user", `<div class="bubble">${escapeHtml(question)}</div>`);
  input.value = "";
  statusEl.textContent = "Thinking...";
  statusEl.className = "status";

  try {
    const answer = await api(`/documents/${currentDocId}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    statusEl.textContent = "";
    const bubbleClass = answer.grounded ? "bubble" : "bubble refused";
    let sourcesHtml = "";
    if (answer.cited_chunks && answer.cited_chunks.length) {
      sourcesHtml = `<details class="sources"><summary>${answer.cited_chunks.length} source(s)</summary>` +
        answer.cited_chunks.map(c => `<div class="source-item">${escapeHtml(c.metadata.heading || ("chunk " + c.metadata.chunk_index))}<br>${escapeHtml(c.text.slice(0, 200))}${c.text.length > 200 ? "…" : ""}</div>`).join("") +
        `</details>`;
    }
    appendChatMessage("assistant", `<div class="${bubbleClass}">${escapeHtml(answer.answer)}</div>${sourcesHtml}`);
  } catch (err) {
    statusEl.textContent = err.status === 503 ? err.message : "Question failed: " + err.message;
    statusEl.className = "status error";
  }
}

document.getElementById("chatSendBtn").addEventListener("click", sendChat);
document.getElementById("chatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendChat();
});
</script>
</body>
</html>
